name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt development tools
        run: sudo apt-get update && sudo apt-get install -y build-essential qtbase5-dev qt5-qmake
      - name: Build application
        run: |
          mkdir build
          cd build
          qmake ../ssh.pro
          make -j2
      - name: Build and run regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir build-tests
          cd build-tests
          qmake ../tests/tests.pro
          make -j2
          ./tst_mainwindow
